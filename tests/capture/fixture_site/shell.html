<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 16px system-ui, sans-serif; }
  .shell { display: flex; height: 100vh; }
  aside { width: 220px; background: #1f1b2e; color: #fff; padding: 24px; }
  main { flex: 1; overflow-y: auto; }
  .block { height: 700px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #fff; }
  .b1 { background: #7c3aed; } .b2 { background: #0ea5e9; } .b3 { background: #f59e0b; } .b4 { background: #10b981; }
</style>
</head>
<body>
<div class="shell">
  <aside><h2>Orbit</h2><p>Inbox</p><p>Notes</p></aside>
  <main><div class="block b1">One</div><div class="block b2">Two</div><div class="block b3">Three</div><div class="block b4">Four</div></main>
</div>
</body>
</html>
