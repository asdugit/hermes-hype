manifest_version: 2
name: hype
version: "1.0.0"
description: >-
  An engine inside a plugin: /hype reads the Hermes session itself and turns what you built into a narrated
  launch trailer, with no prompting and no explaining. The product is the hero; a short proof beat shows the
  session's real diffs, terminal output, tests and numbers. Presets: 7 styles (launch, cinematic, pixel, terminal,
  blueprint, comic, ink), 30/60/90 s, 16:9 or 9:16, plus /hype lore (the making-of) and /hype speedrun.
  Every preset is customizable: key=value knobs (accent, palette, font, music, energy, voice, title, logo,
  language...) or plain words after the style ("/hype launch pink and playful"), applied as one validated
  change set over the preset film. Free roam: a free-text direction without a preset goes to the Director engine,
  which writes, renders, critiques and revises a one-off film. Surfaces: /hype, the hype_render tool, a
  Desktop studio and hermes hype render. Renders locally with headless Chromium and ffmpeg; narration uses your
  Hermes TTS. Opt-in: "blender" / "use blender" renders 3D shots with your own installed Blender, run headless as
  a subprocess (never downloaded).
author: asdugit
license: AGPL-3.0-or-later
homepage: https://github.com/asdugit/hermes-hype
tags: [video, trailer, demo, desktop, tts, ffmpeg, chromium, blender, director]
requires_hermes: ">=0.22.5"
provides_tools: [hype_render, hype_status]
provides_hooks: []
config_schema:
  default_style:
    type: str
    choices: [launch, cinematic, pixel, terminal, blueprint, comic, ink]
    default: launch
    label: Default style
    description: Look used when /hype names no style.
  default_seconds:
    type: int
    default: 60
    label: Default length (seconds)
    description: 15 to 180; 30, 60 and 90 work best.
  aspect:
    type: str
    choices: ["16:9", "9:16", both, "1:1"]
    default: "16:9"
    label: Aspect ratio
    description: both = a 16:9 and a 9:16 film from one storyboard. 1:1 is experimental (kits are laid out for 16:9 and 9:16).
  narration:
    type: bool
    default: true
    label: Narrate with Hermes TTS
    description: Off = captions only (no text is sent to your TTS provider).
  narration_speed:
    type: float
    label: Narration speed (optional)
    description: >-
      TTS speed for every style (0.25-4.0). Empty uses each style's own pace (cinematic 1.13, others 1.0).
      Passed to text_to_speech as speed; audio is never time-stretched.
  redact:
    type: bool
    default: true
    label: Redact secrets, emails and home paths
    description: Applied before anything goes to the model and before rendering.
  effort:
    type: str
    choices: [quick, standard, max]
    default: standard
    label: Directed-film effort
    description: >-
      How many critique and revision rounds a free-text (Directed) film gets. More rounds mean more model calls,
      more time and more cost on your model provider.
  max_parallel_workers:
    type: int
    default: 0
    label: Max render workers
    description: 0 = automatic from free RAM (each worker is one headless Chromium, about 0.5-0.7 GB).
  engine_3d:
    type: str
    choices: [browser, blender, auto]
    default: browser
    label: 3D engine
    description: >-
      browser = three.js in headless Chromium (no install). blender = render 3D shots with your Blender 4.2+
      (headless subprocess on files in the job folder; much nicer camera work and real 3D products, slower).
      auto = Blender when it is installed. Also per film: /hype ... blender, or "use blender" in a direction.
  blender_path:
    type: str
    default: ""
    label: Blender executable (optional)
    description: >-
      Path to blender / blender.exe. Empty = HYPE_BLENDER, PATH, then the usual install folders (incl. where
      the Hermes blender plugin installs it). Hype never downloads Blender.
  customize:
    type: str
    default: ""
    label: Default preset knobs (optional)
    description: >-
      key=value knobs applied to every preset film, lowest priority (the command, tool or studio wins), e.g.
      "accent=#ff4fa3 energy=high font=Fraunces". Look, sound and words: accent, palette, bg, text, font, music,
      energy, voice, captions, transitions, logo, title, tagline, cta, language (docs/CUSTOMIZE.md). Length,
      aspect and narration have their own settings above. Unknown keys and bad values are ignored.
